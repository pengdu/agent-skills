[project]
name = "cuda-optimizer-mcp"
version = "0.1.0"
description = "MCP server: NCU/nsys-driven CUDA performance profiling toolchain"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
cuda-optimizer-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
